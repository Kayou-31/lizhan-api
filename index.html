function home(){return '<div class="announcement">'+icon('bell')+'<span class="label">公告</span><span>全模型 0.1 折体验计划已开启，统一接口，一站接入。</span><a href="#pricing">查看模型价格</a></div><section class="hero"><div class="hero-copy"><div class="eyebrow"><span></span> ONE API. EVERY POSSIBILITY.</div><h1>让好模型，<br><em>用得起。</em></h1><p>汇聚全球主流 AI 模型，告别多平台切换。<br>一个 API，连接你的每一次灵感。</p><div class="hero-buttons"><button class="btn primary" data-register>免费注册，立即接入</button><a class="btn" href="#models">探索模型广场</a></div><div class="hero-note"><span>'+icon('check')+'按量计费</span><span>'+icon('check')+'无月费门槛</span><span>'+icon('check')+'兼容 OpenAI 格式</span></div></div><div class="price-ticket"><div class="ticket-top"><span>每一个模型，都值得放手用</span><span class="ticket-badge">全站同享</span></div><div class="ticket-decor"></div><div class="ticket-price">0.1<span>折</span></div><div class="ticket-sub"><s>100% 的价格</s><span>1% 的成本，100% 的想象力</span></div><div class="ticket-divider"></div><div class="ticket-bottom"><span>文本 · 推理 · 图像 · 音视频</span><strong>ALL MODELS / 01%</strong></div></div></section><section class="metrics"><div class="metric"><div class="metric-label">'+icon('layers')+'模型目录</div><div class="metric-value">'+models.length+'<small>款热门模型</small></div></div><div class="metric"><div class="metric-label">'+icon('grid')+'模型厂商</div><div class="metric-value">'+new Set(models.map(m=>m.provider)).size+'<small>家主流厂商</small></div></div><div class="metric"><div class="metric-label">'+icon('coin')+'全场统一折扣</div><div class="metric-value">0.1<small>折</small></div></div><div class="metric"><div class="metric-label">'+icon('code')+'统一接入格式</div><div class="metric-value">1<small>个 API 即可</small></div></div></section><section><div class="section-header"><div><h2>热门模型<span class="count">POPULAR</span></h2><p>从日常对话到复杂推理，总有适合你的选择。</p></div><a href="#models">查看全部模型</a></div><div class="model-grid">'+models.filter(m=>m.featured).map(card).join('')+'</div></section><section class="lower-grid"><div class="panel"><h3>改一行地址，接入整个模型宇宙。</h3><p>沿用熟悉的 OpenAI SDK，无需重新学习。</p><div class="code-mini">client = OpenAI(<br>&nbsp; base_url=<em>"https://api.lizhan.example/v1"</em>,<br>&nbsp; api_key=<em>"YOUR_API_KEY"</em><br>)</div></div><div class="panel"><h3>你的工具，也能无缝连接。</h3><p>统一的接口格式，适配熟悉的客户端与工作流。</p><div class="integration-icons"><span>Cherry Studio</span><span>Chatbox</span><span>Open WebUI</span><span>LobeChat</span><span>Dify</span><span>NextChat</span></div><a class="btn small" href="#docs" style="margin-top:20px">阅读接入指南</a></div></section>'}
function filterBar(){return '<div class="filter-bar"><div class="tabs">'+['全部','文本','推理','视觉','代码','图像','视频','语音','音乐','向量','重排'].map(t=>'<button class="chip '+(state.type===t?'active':'')+'" data-type="'+t+'">'+t+'</button>').join('')+'</div><label class="search-box">'+icon('search')+'<input id="modelSearch" aria-label="搜索模型或厂商" placeholder="搜索模型名称、厂商…" value="'+esc(state.query)+'"></label></div><div class="provider-filter">'+['全部',...new Set(models.map(m=>m.provider))].map(p=>'<button class="'+(state.provider===p?'active':'')+'" data-provider="'+p+'">'+(p==='全部'?'所有厂商':p)+'</button>').join('')+'</div>'}
function filtered(){return models.filter(m=>(state.provider==='全部'||m.provider===state.provider)&&(state.type==='全部'||m.type===state.type||m.tags.includes(state.type)||(state.type==='视觉'&&m.tags.includes('多模态')))&&(!state.query||(m.name+' '+m.id+' '+m.provider).toLowerCase().includes(state.query.toLowerCase())))}
function resultMarkup(){const list=filtered();if(!list.length)return '<div class="empty">没有找到匹配的模型，试试其他关键词或厂商。</div>';if(state.view==='models')return list.map(card).join('');return '<div class="table-wrap"><table class="price-table"><thead><tr><th>模型 / Model</th><th>能力 / 模态</th><th>输入 / 生成价格</th><th>输出价格</th><th>缓存命中</th><th>折扣</th><th></th></tr></thead><tbody>'+list.map(m=>'<tr><td><div class="table-model">'+logo(m.provider)+'<div><strong>'+esc(m.name)+'</strong><small>'+esc(m.apiId||'模型目录展示')+'</small></div></div></td><td class="muted">'+m.ctx+'</td><td class="discount-price">'+money(m.base)+'<small>/ '+m.unit+'</small></td><td class="discount-price">'+(m.out?money(m.out)+'<small>/ '+m.unit+'</small>':'—')+'</td><td class="discount-price cache-price">'+(m.cache!==null?money(m.cache)+'<small>/ '+m.unit+'</small>':'—')+'</td><td><span class="model-pill">0.1 折</span></td><td><button class="btn small" data-try="'+m.id+'">体验</button></td></tr>').join('')+'</tbody></table></div>'}
function directory(pricing){return '<div class="page-heading"><div><h1>'+(pricing?'好模型，轻松用。':'模型广场')+'</h1><p>'+(pricing?'透明定价，按量使用。全平台统一 0.1 折，探索不设门槛。':'从旗舰推理到图像与音视频，主流模型，一站集结。')+'</p></div><span class="catalog-count">'+models.length+' MODELS / '+new Set(models.map(m=>m.provider)).size+' PROVIDERS<br>更新于 2026.10.07</span></div>'+filterBar()+'<p class="result-count" id="resultCount">共 '+filtered().length+' 款模型</p><div id="modelResults" class="'+(pricing?'':'model-grid')+'">'+resultMarkup()+'</div>'+(pricing?'<div class="info-note">文本类模型的输入、输出与缓存命中均按每百万 tokens 计价；缓存命中是已缓存输入的价格，不与普通输入重复计费。所有价格为虚构演示：原有输入、输出价格保持不变，缓存命中按输入价的 10% 展示；“—”表示不适用。模型名称依据 2026-10-07 查阅的官方目录；本站没有实际模型接入或计费服务。</div>':'')}
function chat(){return '<div class="page-heading"><div><h1>在线调试</h1><p>在开始接入之前，先熟悉你的模型工作台。</p></div><button class="btn small" id="clearChat">新建对话</button></div><div class="chat-layout"><section class="chat-panel"><div class="chat-top"><select id="chatModel" aria-label="选择对话模型">'+models.map(m=>'<option value="'+m.id+'" '+(m.id===state.model?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select><span>Playground · 访客预览</span></div><div class="chat-messages" id="chatMessages"></div><form class="composer" id="chatForm"><textarea id="chatInput" aria-label="输入对话内容" placeholder="输入消息，开始探索…" rows="2"></textarea><div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button class="btn primary small" type="submit">发送 '+icon('send')+'</button></div></form></section><aside class="parameter-panel"><h3>模型参数</h3><div class="parameter"><label for="temperature">Temperature <output id="temperatureValue">0.7</output></label><input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7"></div><div class="parameter"><label for="maxTokens">Max tokens <output id="maxTokensValue">2048</output></label><input type="range" id="maxTokens" min="256" max="8192" step="256" value="2048"></div><p>Temperature 控制回答的随机性。较低值适合确定性任务，较高值适合创意探索。</p><div class="info-note">界面演示，模型未连接。发送内容仅在当前页面显示。</div><button class="btn primary" style="width:100%;margin-top:20px" data-register>注册并获取 API Key</button></aside></div>'}
const codeExample='from openai import OpenAI\n\nclient = OpenAI(\n    base_url="https://api.lizhan.example/v1",\n    api_key="YOUR_API_KEY"\n)\n\nresponse = client.chat.completions.create(\n    model="gpt-6-astra",\n    messages=[\n        {"role": "user", "content": "你好，世界。"}\n    ]\n)\n\nprint(response.choices[0].message.content)';
function docs(){return '<div class="page-heading"><div><h1>开发者文档</h1><p>熟悉的接口格式，简单的接入步骤。</p></div></div><div class="doc-grid"><nav class="doc-index" aria-label="文档目录"><a href="#docs" data-anchor="docStart">快速开始</a><a href="#docs" data-anchor="docKey">获取 API Key</a><a href="#docs" data-anchor="docCode">第一个请求</a><a href="#docs" data-anchor="docFaq">常见问题</a></nav><article class="panel doc-article"><h2 id="docStart">快速开始</h2><p>厘站 API 的界面遵循常见中转平台的使用方式：创建账户、获取密钥、选择模型，并在客户端中填写统一的请求地址。</p><div class="info-note">这是静态交互演示。下方 .example 地址为保留的示例域名，不提供真实服务，请勿填写真实密钥或向其发送请求。</div><h3 id="docKey">01 / 创建账户与获取密钥</h3><p>点击页面右上角的注册按钮，填写账户信息并确认。注册体验可以完整走到最终提交步骤。</p><button class="btn small primary" data-register>创建账户</button><h3 id="docCode">02 / 第一个请求</h3><p>下面展示常见的 Python SDK 调用格式。更换 model 字段，即可在格式上选择不同模型。</p><div class="code-heading"><span class="muted" style="font-size:12px">Python · OpenAI SDK</span><button id="copyCode">复制代码</button></div><pre><code>'+esc(codeExample)+'</code></pre><h3 id="docFaq">03 / 常见问题</h3><p><strong>0.1 折是多少？</strong><br>0.1 折是原价的 1%，例如基准价 ¥10，折后为 ¥0.10。页面价格均为演示数据。</p><p><strong>这里真的可以调用模型吗？</strong><br>目前为独立制作的静态体验页面，没有模型调用、充值、登录或真实账户系统。模型名称仅用于展示，与各厂商无关联。</p><p><strong>填写的注册信息会去哪里？</strong><br>只在当前标签页临时用于确认信息，不上传、不写入浏览器存储，关闭注册窗口后清空。</p></article></div>'}
function render(){main.innerHTML='<div class="view">'+(state.view==='home'?home():state.view==='models'?directory(false):state.view==='pricing'?directory(true):state.view==='playground'?chat():docs())+footer()+'</div>';document.getElementById('breadcrumb').textContent=names[state.view];document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===state.view);if(a.dataset.nav===state.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(state.view==='playground')renderMessages()}
function route(){const hash=location.hash.slice(1).split('/')[0];if(hash==='register'){if(!main.children.length)render();openRegister();return}state.view=names[hash]?hash:'home';state.query='';state.provider='全部';state.type='全部';render();closeMenu();window.scrollTo(0,0)}
function updateResults(){document.getElementById('modelResults').innerHTML=resultMarkup();document.getElementById('resultCount').textContent='共 '+filtered().length+' 款模型';document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===state.type));document.querySelectorAll('[data-provider]').forEach(b=>b.classList.toggle('active',b.dataset.provider===state.provider))}
function renderMessages(){const box=document.getElementById('chatMessages');if(!box)return;box.innerHTML=state.messages.length?state.messages.map(m=>'<div class="message '+m.role+'">'+esc(m.text)+'</div>').join(''):'<div class="chat-welcome"><span class="brand-mark">L</span><h2>今天，想探索什么？</h2><p>选择一个模型，从一个好问题开始。</p><div class="prompt-chips"><button data-prompt="帮我写一段 Python 代码">写一段代码</button><button data-prompt="给我的周末计划一些灵感">寻找灵感</button><button data-prompt="用简单的话解释量子计算">解释一个概念</button></div></div>';box.scrollTop=box.scrollHeight}
function sendMessage(){const input=document.getElementById('chatInput');const value=input.value.trim();if(!value){toast('先输入一条消息吧');return}state.messages.push({role:'user',text:value},{role:'assistant',text:'当前为访客预览，尚未连接模型。你可以体验模型切换和参数设置，或点击右上角注册，继续开启工作空间。'});input.value='';renderMessages()}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000)}
const form=document.getElementById('registerForm'),registerDialog=document.getElementById('registerDialog');
function setRegisterStep(step){state.registerStep=step;document.getElementById('registerFields').hidden=step!==1;document.getElementById('registerConfirm').hidden=step!==2;document.getElementById('step1').classList.toggle('active',step===1);document.getElementById('step2').classList.toggle('active',step===2);registerDialog.scrollTop=0}
function clearFieldErrors(){document.getElementById('registrationStatus').hidden=true;form.querySelectorAll('.field-error').forEach(el=>el.hidden=true);form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'))}
function openRegister(){if(registerDialog.open)return;form.reset();clearFieldErrors();setRegisterStep(1);registerDialog.showModal();document.body.style.overflow='hidden'}
function prepareConfirmation(){const pairs=[['用户名','username'],['邮箱','email'],['手机号','phone'],['性别','gender'],['地区','region']];document.getElementById('confirmList').innerHTML=pairs.map(([label,name])=>'<dt>'+label+'</dt><dd>'+esc(form.elements.namedItem(name).value||'未填写')+'</dd>').join('')+'<dt>密码</dt><dd>••••••••</dd>';setRegisterStep(2);document.getElementById('confirmRegister').focus()}
function finishRegistration(){setRegisterStep(1);document.getElementById('registrationStatus').hidden=false;form.querySelectorAll('.field-error').forEach(el=>el.hidden=false);form.querySelectorAll('.field input:not([type="hidden"]),.field select').forEach(el=>el.setAttribute('aria-invalid','true'));form.elements.username.focus()}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileScrim').classList.remove('open');document.getElementById('menuToggle').setAttribute('aria-expanded','false')}
const notices={privacy:['隐私说明','本页面不连接注册接口、不发送表单数据，不使用 Cookie、localStorage 或统计脚本。注册资料仅在当前页面内临时用于核对，关闭注册窗口后清空。请使用虚构资料，勿输入真实密码。'],terms:['用户条款','厘站 API 是一个独立制作的趣味静态演示，不提供真实注册、模型调用、充值或付费服务。页面展示的模型名称属于相应权利人，仅用于目录演示。'],about:['关于厘站 API','一个关于“全模型、全场 0.1 折”的小小互联网玩笑。你可以探索模型目录、查看演示价格和体验注册流程。我们的后端工程师给每一个字段都加了唯一约束。对，性别也是。本站与展示的模型厂商无关联。']};
function showNotice(kind){const [title,body]=notices[kind];document.getElementById('noticeTitle').textContent=title;document.getElementById('noticeBody').innerHTML='<p>'+body+'</p>';document.getElementById('noticeDialog').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.hasAttribute('data-register')){e.preventDefault();openRegister()}else if(b.dataset.close){document.getElementById(b.dataset.close).close()}else if(b.dataset.try){state.model=b.dataset.try;if(state.view==='playground')render();else location.hash='playground'}else if(b.dataset.type){state.type=b.dataset.type;updateResults()}else if(b.dataset.provider){state.provider=b.dataset.provider;updateResults()}else if(b.dataset.prompt){document.getElementById('chatInput').value=b.dataset.prompt;document.getElementById('chatInput').focus()}else if(b.dataset.notice){showNotice(b.dataset.notice)}else if(b.dataset.password){const input=form.elements.namedItem(b.dataset.password);input.type=input.type==='password'?'text':'password';b.setAttribute('aria-label',(input.type==='password'?'显示':'隐藏')+(b.dataset.password==='confirmPassword'?'确认密码':'密码'))}else if(b.dataset.anchor){e.preventDefault();document.getElementById(b.dataset.anchor).scrollIntoView({behavior:'smooth'})}else if(b.id==='backToEdit'){setRegisterStep(1);form.elements.username.focus()}else if(b.id==='clearChat'){state.messages=[];renderMessages()}else if(b.id==='copyCode'){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(codeExample).then(()=>toast('示例代码已复制')).catch(()=>toast('浏览器未允许复制，请手动选择代码'));else toast('请手动选择并复制代码')}else if(b.id==='menuToggle'){const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('mobileScrim').classList.toggle('open',open);b.setAttribute('aria-expanded',String(open))}});
document.addEventListener('input',e=>{if(e.target.id==='modelSearch'){state.query=e.target.value;updateResults()}else if(e.target.id==='temperature'){document.getElementById('temperatureValue').textContent=e.target.value}else if(e.target.id==='maxTokens'){document.getElementById('maxTokensValue').textContent=e.target.value}});
document.addEventListener('change',e=>{if(e.target.id==='chatModel')state.model=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id==='registerForm'){e.preventDefault();state.registerStep===1?prepareConfirmation():finishRegistration()}else if(e.target.id==='chatForm'){e.preventDefault();sendMessage()}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});
document.getElementById('mobileScrim').addEventListener('click',closeMenu);
registerDialog.addEventListener('close',()=>{form.reset();clearFieldErrors();document.getElementById('confirmList').textContent='';document.body.style.overflow='';form.querySelectorAll('.password-wrap input').forEach(i=>i.type='password');form.querySelectorAll('[data-password]').forEach(b=>b.setAttribute('aria-label','显示'+(b.dataset.password==='confirmPassword'?'确认密码':'密码')));setRegisterStep(1)});
form.querySelectorAll('.field').forEach(field=>{const input=field.querySelector('input,select');const error=document.createElement('span');error.className='field-error';error.id='error-'+input.name;error.hidden=true;error.textContent=input.name==='gender'?'不可重复选择':'不可重复';input.setAttribute('aria-describedby',error.id);field.appendChild(error)});
window.addEventListener('hashchange',route);hydrateIcons();route();
</script>
